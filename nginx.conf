server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: alles wat geen bestand is valt terug op index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kaartdata en 3D-modellen zijn gehasht noch vaak gewijzigd, maar wel groot.
    location ~* \.(glb|gltf|json|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;
    gzip_min_length 1024;
}
