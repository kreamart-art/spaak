server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: alles wat geen bestand is valt terug op index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hasht deze namen, dus ze kunnen niet verouderen.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Modellen en kaartdata houden hun naam over een uitrol heen. Ze mogen dus
    # wel in de cache, maar moeten elke keer geverifieerd worden; anders blijft
    # een bezoeker na een update een week op het oude model zitten.
    location ~* \.(glb|gltf|json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;
    gzip_min_length 1024;
}
